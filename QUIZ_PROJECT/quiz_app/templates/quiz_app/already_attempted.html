{% extends 'quiz_app/base.html' %}
{% block title %}Quiz Already Attempted{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h3 class="text-danger">⚠️ You have already submitted the quiz: <span class="text-primary">{{ quiz.title }}</span></h3>
    <p class="text-muted">You cannot re-attempt this quiz.</p>
    <a href="{% url 'student_quiz_list' %}" class="btn btn-outline-primary mt-3">← Back to Quizzes</a>
</div>
{% endblock %}
