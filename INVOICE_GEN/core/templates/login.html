{% extends "base.html" %}
{% block title %}Login - Invoice Generator{% endblock %}

{% block content %}
<div class="col-md-6 mx-auto animate__animated animate__fadeInDown">
    <div class="card shadow">
        <div class="card-header bg-dark text-white text-center">
            <h4 class="mb-0"><i class="fas fa-sign-in-alt me-2"></i>Login</h4>
        </div>
        <div class="card-body">
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" name="username" id="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-lock me-1"></i> Login
                </button>
                
                <div class="mt-3 text-center">
                    <a href="{% url 'register' 'admin' %}" class="me-3">Register as Admin</a>
                    <a href="{% url 'register' 'staff' %}">Register as Staff</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
