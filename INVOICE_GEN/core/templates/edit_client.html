{% extends "base.html" %}
{% block title %}Edit Client - {{ client.name }}{% endblock %}

{% block content %}
<div class="col-md-8 mx-auto animate__animated animate__fadeInDown mb-5">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0"><i class="fas fa-edit me-1"></i> Edit Client</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-warning w-100">
                    <i class="fas fa-save me-1"></i> Save Changes
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
